server {
    listen  80;
    server_name fire-server.crelink.cn;

    error_log  /var/log/nginx/fire-server.crelink.cn.error.log;
    access_log  /var/log/nginx/fire-server.crelink.cn.access.log main;

    root   /data/www;
    index  index.html index.php;

    autoindex  off;
    autoindex_exact_size  off;
    autoindex_localtime  off;
    underscores_in_headers  on;

    include  includes/fire-server.conf;
}