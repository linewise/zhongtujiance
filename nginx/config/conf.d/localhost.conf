server {
    listen  80;
    server_name  localhost 127.0.0.1 47.108.220.22 zhongtujiance.com www.zhongtujiance.com;

    error_log  /var/log/nginx/localhost.error.log;
    access_log  /var/log/nginx/localhost.access.log main;

    autoindex  off;
    autoindex_exact_size  off;
    autoindex_localtime  off;
    underscores_in_headers  on;

    root   /data/www/public;
    index  index.php index.html;

    # certbot HTTP-01 校验文件目录（由 scripts/certbot.sh 写入）
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type text/plain;
        access_log   off;
    }

    include  includes/thinkphp5.conf;
    include  includes/fire-server.conf;
    include  includes/fire-admin.conf;
}

server {
    listen  443 ssl;
    server_name  localhost 127.0.0.1 47.108.220.22 zhongtujiance.com www.zhongtujiance.com;

    error_log  /var/log/nginx/localhost.error.log;
    access_log  /var/log/nginx/localhost.access.log main;

    autoindex  off;
    autoindex_exact_size  off;
    autoindex_localtime  off;
    underscores_in_headers  on;

    root   /data/www/public;
    index  index.php index.html;

    ssl_certificate      /etc/letsencrypt/live/zhongtujiance.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/zhongtujiance.com/privkey.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;

    include  includes/thinkphp5.conf;
    include  includes/fire-server.conf;
    include  includes/fire-admin.conf;
}