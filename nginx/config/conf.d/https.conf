server {
    listen  443 ssl;
    server_name  zhongtujiance.com www.zhongtujiance.com;

    ssl_certificate      /etc/letsencrypt/live/zhongtujiance.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/zhongtujiance.com/privkey.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    error_log  /var/log/nginx/https.error.log;
    access_log  /var/log/nginx/https.access.log main;

    root   /data/www/public;
    index  index.php index.html;

    autoindex  off;
    autoindex_exact_size  off;
    autoindex_localtime  off;
    underscores_in_headers  on;

    location ^~ /.well-known/acme-challenge/ {
        root /data/www/certbot;
    }

    include  includes/base.conf;
    include  includes/thinkphp5.conf;
    include  includes/fire-server.conf;
    include  includes/fire-admin.conf;
}
